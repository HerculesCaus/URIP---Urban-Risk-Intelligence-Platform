<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URIP – Urban Risk Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--sf:#fff;--ink:#102A43;--mute:#627D98;--line:#D9E2EC;--brand:#0B6E99;--brandT:#E3F2F8;--low:#1E8E55;--lowT:#E1F5EA;--med:#B7791F;--medT:#FEF3D7;--high:#C4510B;--highT:#FDE6D5;--crit:#C0262F;--critT:#FBE0E2;--map:#D5E3F0;--road:#fff;--track:#E4EBF2;--off:#BCCCDC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1B29;--sf:#16283A;--ink:#EAF1F8;--mute:#9FB3C8;--line:#2A4057;--brand:#4FB1D3;--brandT:#173B4D;--lowT:#143A29;--medT:#3F3213;--highT:#442A18;--critT:#4A1D22;--low:#4CC585;--med:#E3B04B;--high:#F0894A;--crit:#F26B74;--map:#1E3A52;--road:#2B4A66;--track:#2A4057;--off:#4A6177}}
:root[data-theme="dark"]{--bg:#0E1B29;--sf:#16283A;--ink:#EAF1F8;--mute:#9FB3C8;--line:#2A4057;--brand:#4FB1D3;--brandT:#173B4D;--lowT:#143A29;--medT:#3F3213;--highT:#442A18;--critT:#4A1D22;--low:#4CC585;--med:#E3B04B;--high:#F0894A;--crit:#F26B74;--map:#1E3A52;--road:#2B4A66;--track:#2A4057;--off:#4A6177}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{max-width:430px;margin:0 auto;padding:16px 20px 96px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{font-size:22px;font-weight:700;margin:0}h2{font-size:15px;font-weight:600;margin:0}
.sub,.m,small{color:var(--mute);font-size:13px}.mt{font-size:12px;font-weight:500;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.g{flex-wrap:wrap}.f{flex:1}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--sf);font-weight:500;font-size:13px;text-align:center}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bd{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ac{display:flex;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
.ac i{width:4px;border-radius:2px;flex:none}.ac>div{display:flex;flex-direction:column;gap:5px;flex:1}.ac b{font-size:15px;font-weight:600}.ac em{font-style:normal;font-size:12px;font-weight:500;color:var(--brand)}
.btn{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--sf);font-weight:600;text-align:center;width:100%}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.s{padding:10px}.btn[disabled]{opacity:.5}
input,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:inherit}
label{display:flex;flex-direction:column;gap:6px}
.tg{width:44px;height:26px;border-radius:20px;background:var(--off);padding:3px;display:flex;flex:none}.tg.on{background:var(--brand);justify-content:flex-end}.tg:after{content:"";width:20px;height:20px;border-radius:50%;background:#fff}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px;flex:1}.kpi b{display:block;font-size:22px}
.map{border-radius:14px;overflow:hidden;background:var(--map)}.map svg{display:block;width:100%;height:auto}
.st{display:flex;gap:6px}.st div{flex:1;text-align:center;font-size:10px;color:var(--mute)}.st i{display:block;height:5px;border-radius:3px;background:var(--track);margin-bottom:6px}.st .on i{background:var(--brand)}.st .cu{color:var(--brand);font-weight:600}
.bar{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%}
.hero{background:var(--brand);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}.hero .bar{background:rgba(255,255,255,.3);flex:none}.hero .bar i{background:#fff}
.nt{display:flex;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}.nt.rd{opacity:.8}.nt u{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;text-decoration:none}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:flex;background:var(--sf);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--mute)}nav .on{color:var(--brand);font-weight:600}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:90%;display:none;z-index:5}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;margin:0;max-height:240px;overflow:auto}
.link{color:var(--brand);font-weight:500}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),RK=['Baixo','Médio','Alto','Crítico'],RC={'Crítico':'crit','Alto':'high','Médio':'med','Baixo':'low'};
const BASE={'Sensor IoT':95,'Base pública':92,'Comunidade':75,'Operador':88},AREAS=['Zona Sul','Centro','Zona Leste','Zona Norte'];
const POS={'Zona Sul':[70,48],'Centro':[170,100],'Zona Leste':[282,66],'Zona Norte':[300,148]};
const TT={alagamento:'Alagamento reportado',calor:'Calor extremo reportado',energia:'Falta de energia reportada',agua:'Falta de água reportada',transporte:'Interrupção de transporte reportada'};
const now=()=>Date.now(),mn=m=>now()-m*6e4;
const ago=t=>{const s=Math.max(0,Math.round((now()-t)/1e3));return s<60?`há ${s} s`:s<3600?`há ${Math.round(s/60)} min`:`há ${Math.round(s/3600)} h`};
const rConf=r=>Math.max(0,Math.round(BASE[r.kind]-Math.min(20,(now()-r.at)/12e4)));
const clsC=c=>c>=80?'Alta':c>=50?'Média':'Baixa',cC=c=>c>=80?'low':c>=50?'med':'crit';
const C=e=>{const c=e.reads.map(rConf),mx=Math.max(...c),av=c.reduce((a,b)=>a+b,0)/c.length;return Math.min(99,Math.round(.6*mx+.4*av)+Math.min(6,(new Set(e.reads.map(r=>r.kind)).size-1)*3))};
const R=e=>{const v=e.val;let r;if(e.type==='alagamento')r=v>=3?3:v>=2.8?2:v>=2.2?1:0;else if(e.type==='calor')r=v>=45?3:v>=40?2:v>=36?1:0;else r=e.aff>=8000?3:e.aff>=2000?2:e.aff>=500?1:0;return RK[r]};
const DEF={min:'Alto',push:true,mail:true,sms:false,t:{alagamento:true,calor:true,servicos:true,transporte:false}};
let S={user:null,lf:'Todos',pf:'todos',nf:'todas',sel:1,id:10,last:now(),prefs:JSON.parse(JSON.stringify(DEF)),cons:{loc:true,share:true,pers:true},nt:[],audit:[],reg:[],form:{type:'alagamento',local:'',desc:'',anon:true,photo:false},pan:null,del:false,perfil:'Morador'};
try{const s=JSON.parse(localStorage.getItem('urip')||'null');if(s){S.user=s.user;S.prefs=s.prefs||S.prefs;S.cons=s.cons||S.cons}}catch(e){}
const save=()=>{try{localStorage.setItem('urip',JSON.stringify({user:S.user,prefs:S.prefs,cons:S.cons}))}catch(e){}};
const rd=(kind,name,meta,at)=>({kind,name,meta,at});
S.ev=[{id:1,type:'alagamento',title:'Alagamento na Av. Marginal',area:'Zona Sul',val:3.2,aff:1200,status:'Alerta emitido',reads:[rd('Sensor IoT','Estação 07, nível do rio','leitura 3,2 m',now()-12e3),rd('Base pública','Previsão de chuva, órgão meteorológico','intensidade alta',mn(8)),rd('Comunidade','3 registros de moradores','fotos anexadas',mn(6))]},
{id:2,type:'calor',title:'Ilha de calor com sensação de 41 °C',area:'Centro',val:41,aff:0,status:'Alerta emitido',reads:[rd('Sensor IoT','Estação térmica do Centro','41 °C',mn(25)),rd('Base pública','Boletim meteorológico','sensação de 41 °C',mn(20))]},
{id:3,type:'energia',title:'Queda de energia em 3 quarteirões',area:'Zona Leste',val:0,aff:600,status:'Em validação',reads:[rd('Comunidade','Relato de morador','sem energia desde as 14h',mn(20)),rd('Comunidade','Relato de morador','quarteirão sem luz',mn(32))]},
{id:4,type:'agua',title:'Interrupção no abastecimento de água',area:'Zona Norte',val:0,aff:3500,status:'Alerta emitido',reads:[rd('Base pública','Concessionária de água','manutenção emergencial',mn(10))]}];
S.nt=[{id:1,ev:1,title:'Alerta crítico: alagamento na Av. Marginal',text:'Evite a área. Rotas alternativas disponíveis.',at:mn(4),risk:'Crítico',read:false},{id:2,ev:2,title:'Ilha de calor no Centro',text:'Sensação de 41 °C. Hidrate-se e evite o sol.',at:mn(18),risk:'Alto',read:false},{id:3,ev:3,title:'Atualização: queda de energia',text:'Equipe da concessionária a caminho.',at:mn(32),risk:'Médio',read:true},{id:4,ev:null,title:'Seu registro foi validado',text:'Obrigado por contribuir com a comunidade.',at:mn(60),risk:null,read:true}];
// Motor de eventos: validação, confiança, risco, ciclo de vida e notificação (RF02 a RF07, RF10)
const log=(e,a,u='Sistema')=>S.audit.push({at:now(),u,a,ev:e.id}),setSt=(e,s,u)=>{e.status=s;log(e,s,u)};
function notify(e){const p=S.prefs,rk=RK.indexOf(R(e)),g=e.type==='energia'||e.type==='agua'?'servicos':e.type;if(S.cons.pers&&(rk<RK.indexOf(p.min)||!p.t[g]))return;if(!S.cons.pers&&rk<3)return;const ch=[p.push&&'push',p.mail&&'e-mail',p.sms&&'SMS'].filter(Boolean).join(', ')||'o app';S.nt.unshift({id:S.id++,ev:e.id,title:`Alerta ${R(e).toLowerCase()}: ${e.title}`,text:`Origem e confiança no detalhe. Enviado por ${ch}.`,at:now(),risk:R(e),read:false})}
function confirmEv(e,u){setSt(e,'Confirmado',u);if(RK.indexOf(R(e))>=1){setSt(e,'Alerta emitido',u);notify(e)}else setSt(e,'Em monitoramento',u)}
function evaluate(e){if(e.status==='Reportado')setSt(e,'Em validação');if(e.status==='Em validação'){const c=C(e),k=new Set(e.reads.map(r=>r.kind));if(c<35)setSt(e,'Descartado');else if(c>=50&&(k.size>1||!k.has('Comunidade')))confirmEv(e)}else if(e.status==='Em monitoramento'&&RK.indexOf(R(e))>=1){setSt(e,'Alerta emitido');notify(e)}}
function tick(){const c=S.ev.filter(e=>!['Encerrado','Descartado'].includes(e.status)&&['alagamento','calor'].includes(e.type)&&e.reads.some(r=>r.kind==='Sensor IoT'));const e=c[Math.floor(Math.random()*c.length)];if(!e)return;const d=e.type==='alagamento'?(Math.random()-.4)*.3:(Math.random()-.4)*2,v=+(e.val+d).toFixed(1);if(!Number.isFinite(v)||v<0)return;e.val=v;const r=e.reads.find(x=>x.kind==='Sensor IoT');r.at=now();r.meta=e.type==='alagamento'?`leitura ${String(v).replace('.',',')} m`:`${v} °C`;S.last=now();evaluate(e);if(['painel','alertas','detalhe','origem','avisos'].includes(page()))render()}
function register(f){if(f.desc.trim().length<10)return'Descreva a ocorrência com pelo menos 10 caracteres.';if(!f.local.trim())return'Informe o local da ocorrência.';const area=AREAS.find(a=>f.local.toLowerCase().includes(a.toLowerCase()))||'Zona Sul',kind=S.user.perfil==='Operador'?'Operador':'Comunidade';const r=rd(kind,f.anon?'Registro anônimo':'Registro de '+S.user.perfil.toLowerCase(),f.desc.trim().slice(0,60)+(f.photo?' (foto anexada)':''),now());let e=S.ev.find(x=>x.type===f.type&&x.area===area&&!['Encerrado','Descartado'].includes(x.status)),m;if(e){e.reads.push(r);m='Registro somado a um evento existente na mesma área.'}else{e={id:S.id++,type:f.type,title:TT[f.type],area,val:f.type==='alagamento'?2.2:f.type==='calor'?37:0,aff:['alagamento','calor'].includes(f.type)?0:600,status:'Reportado',reads:[r]};S.ev.push(e);log(e,'Reportado');m='Registro recebido.'}evaluate(e);S.reg.push({at:now(),tipo:f.type,area,anonimo:f.anon,compartilhado:S.cons.share});S.last=now();return`${m} Estado do evento: ${e.status}.`}
// Interface
const IC={painel:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',alertas:'<path d="M12 3 22 20H2L12 3Z"/><path d="M12 10v4M12 17v.01"/>',avisos:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',registrar:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',privacidade:'<path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/>'};
const NAV=[['painel','Painel'],['alertas','Alertas'],['avisos','Avisos'],['registrar','Registrar'],['privacidade','Privacidade']];
const page=()=>location.hash.slice(1)||'login',go=p=>{location.hash=p},bd=(t,c)=>`<span class="bd" style="color:var(--${c});background:var(--${c}T)">${t}</span>`;
const chips=(a,cur,k)=>a.map(x=>`<button class="chip${x===cur?' on':''}" data-chip="${k}" data-v="${x}">${x}</button>`).join('');
const tg=(k,on,l)=>`<div class="set"><span>${l}</span><button class="tg${on?' on':''}" data-tog="${k}" role="switch" aria-checked="${on}" aria-label="${l}"></button></div>`;
const act=()=>S.ev.filter(e=>!['Encerrado','Descartado'].includes(e.status)).sort((a,b)=>RK.indexOf(R(b))-RK.indexOf(R(a))||C(b)-C(a));
const best=e=>[...e.reads].sort((a,b)=>rConf(b)-rConf(a))[0],last=e=>Math.max(...e.reads.map(r=>r.at));
const card=e=>{const r=R(e),c=C(e);return`<button class="ac" data-ev="${e.id}"><i style="background:var(--${RC[r]})"></i><div><div class="row">${bd(r,RC[r])}<small>${ago(last(e))}</small></div><b>${e.title}</b><span class="m">${e.area} · ${e.aff?`cerca de ${e.aff} moradores na área`:'monitoramento ativo'}</span><em>${best(e).kind} · Confiança ${c}%</em></div></button>`};
const back=(p,l)=>`<button class="link" data-go="${p}">‹  ${l}</button>`,bar=(w,c,v)=>`<div class="bar" style="${w?`flex:none;width:${w}px`:''}"><i style="width:${c}%;background:var(--${v})"></i></div>`;
const grp=e=>e.type==='alagamento'?'Alagamento':e.type==='calor'?'Calor':'Serviços';
const V={
login(){return`<div style="padding-top:24px" class="row"><div style="width:64px;height:64px;border-radius:18px;background:var(--brand);display:grid;place-items:center"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">${IC.privacidade}</svg></div></div><div><h1>Urban Risk Intelligence Platform</h1><div class="sub">Monitoramento de riscos urbanos: alagamentos, calor e serviços essenciais</div></div>
<label><span class="mt">E-mail</span><input id="em" type="email" autocomplete="email" placeholder="nome@email.com"></label><label><span class="mt">Senha</span><input id="pw" type="password" autocomplete="current-password" placeholder="mínimo de 4 caracteres"></label>
<div class="mt">Entrar como</div><div class="row">${['Morador','Agente','Operador'].map(x=>`<button class="chip f${x===S.perfil?' on':''}" data-chip="perfil" data-v="${x}">${x}</button>`).join('')}</div><div id="err" class="m" style="color:var(--crit)"></div>
<button class="btn p" data-act="login">Entrar</button><div class="mt" style="text-align:center;font-weight:400">Ao continuar, você concorda com o tratamento de dados conforme a LGPD. Demonstração: use qualquer e-mail válido.</div>`},
painel(){const A=act(),f=S.pf==='todos'?A:A.filter(e=>grp(e)===S.pf),n=r=>A.filter(e=>R(e)===r).length;const pins=f.map(e=>{const p=POS[e.area];return`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="var(--${RC[R(e)]})" stroke="#fff" stroke-width="3" data-ev="${e.id}" style="cursor:pointer" tabindex="0" role="button" aria-label="${e.title}"/>`}).join('');
return`<div><h1>Painel de acompanhamento</h1><div class="sub">Zona Sul · atualizado <span id="upd">${ago(S.last)}</span> · 38 fontes ativas</div></div><div class="row g">${chips(['Todos','Alagamento','Calor','Serviços'],S.pf==='todos'?'Todos':S.pf,'pf')}</div>
<div class="map"><svg viewBox="0 0 350 200" role="img" aria-label="Mapa de risco da região"><rect x="0" y="60" width="350" height="10" fill="var(--road)"/><rect x="0" y="130" width="350" height="8" fill="var(--road)"/><rect x="90" width="9" height="200" fill="var(--road)"/><rect x="240" width="10" height="200" fill="var(--road)"/><rect y="175" width="350" height="16" fill="#A9C8E3" opacity=".7"/>${pins}<rect x="10" y="10" rx="10" width="168" height="22" fill="var(--sf)"/><text x="20" y="25" font-size="11" font-weight="600" fill="var(--ink)">${f.length} pontos de risco · Zona Sul</text></svg></div>
<div class="row"><div class="kpi"><b style="color:var(--crit)">${n('Crítico')}</b><span class="mt">Críticos</span></div><div class="kpi"><b style="color:var(--high)">${n('Alto')}</b><span class="mt">Altos</span></div><div class="kpi"><b style="color:var(--brand)">${S.ev.filter(e=>e.status==='Em monitoramento').length}</b><span class="mt">Monitorando</span></div></div><h2>Alertas prioritários</h2>${f.slice(0,2).map(card).join('')||'<div class="m">Nenhum alerta para este filtro.</div>'}`},
alertas(){const l=act().filter(e=>S.lf==='Todos'||R(e)===S.lf);return`<div><h1>Alertas</h1><div class="sub">Ordenados por nível de risco e confiança</div></div><div class="row g">${chips(['Todos','Crítico','Alto','Médio'],S.lf,'lf')}</div>${l.map(card).join('')||'<div class="m">Nenhum alerta neste nível.</div>'}`},
detalhe(){const e=S.ev.find(x=>x.id===S.sel);if(!e)return back('alertas','Alertas');const r=R(e),c=C(e),ST=['Reportado','Em validação','Confirmado','Alerta emitido','Em monitoramento'],i=e.status==='Encerrado'?4:e.status==='Descartado'?1:ST.indexOf(e.status),a=S.user.perfil==='Agente',can={Confirmar:['Reportado','Em validação'],Monitorar:['Confirmado','Alerta emitido'],Descartar:['Reportado','Em validação','Confirmado'],Encerrar:['Alerta emitido','Em monitoramento']};
const bts=Object.keys(can).filter(k=>can[k].includes(e.status));const au=S.audit.filter(x=>x.ev===e.id).slice(-3);
return`${back('alertas','Alertas')}<div class="row g">${bd(r,RC[r])}${bd(e.status,e.status==='Descartado'?'low':'brand')}</div><h1 style="font-size:20px">${e.title}</h1><div class="sub" style="font-size:14px">${e.area}${e.type==='alagamento'?`. Nível do rio em ${String(e.val).replace('.',',')} m (limite de 2,8 m)`:e.type==='calor'?`. Sensação térmica de ${e.val} °C`:''}${e.aff?`. Cerca de ${e.aff} moradores na área de impacto.`:'.'}</div>
<div class="st" aria-label="Ciclo de vida do evento">${ST.map((s,k)=>`<div class="${k<=i?'on':''}${k===i?' cu':''}"><i></i>${s==='Em monitoramento'?'Monitorando':s}</div>`).join('')}</div>
<div class="card"><div class="row sp"><h2>Origem e confiança</h2>${bd(clsC(c)+' · '+c+'%',cC(c))}</div>${e.reads.map(x=>`<div class="sub" style="font-size:13px">${x.kind}, ${x.name} · ${rConf(x)}%</div>`).join('')}<button class="btn s" data-go="origem">Ver origem e confiança dos dados</button></div>
${a?`<div class="mt">Ações do agente (Defesa Civil)</div><div class="row g">${bts.map(b=>`<button class="btn s f${b==='Confirmar'?' p':''}" data-act="${b}">${b}</button>`).join('')||'<span class="m">Evento finalizado.</span>'}</div>${au.length?`<div class="mt">Trilha de auditoria: ${au.map(x=>`${x.a} (${x.u})`).join(' → ')}</div>`:''}`:''}`},
origem(){const e=S.ev.find(x=>x.id===S.sel);if(!e)return back('alertas','Alertas');const c=C(e);return`${back('detalhe','Detalhe do alerta')}<div><h1>Origem e nível de confiança</h1><div class="sub">Como cada dado foi coletado e validado</div></div><div class="hero"><span style="font-size:12px;opacity:.85">Confiança geral do alerta</span><div class="row"><b style="font-size:28px">${c}%</b><span class="bd" style="background:rgba(255,255,255,.25)">${clsC(c)}</span></div><div class="bar"><i style="width:${c}%"></i></div></div>
${e.reads.map(x=>{const k=rConf(x),v=x.kind==='Comunidade'?'Corroborado':'Validado',z=x.kind==='Comunidade'&&e.reads.length<2?'Em validação':v;return`<div class="card"><div class="row sp">${bd(x.kind,'brand')}${bd(z,z==='Validado'?'low':'med')}</div><h2>${x.name}</h2><span class="m" style="font-size:12px">Atualizado ${ago(x.at)} · ${x.meta}</span><div class="row">${bar(0,k,cC(k))}<b>${k}%</b></div></div>`}).join('')}
<div class="card"><div class="row g">${bd('Alta ≥ 80%','low')}${bd('Média 50–79%','med')}${bd('Baixa < 50%','crit')}</div><span class="m" style="font-size:11px">A confiança considera o tipo da fonte, a atualidade do dado e a corroboração por outras fontes.</span></div>`},
avisos(){const n=S.nt.filter(x=>S.nf==='todas'||!x.read),u=S.nt.filter(x=>!x.read).length;return`<div class="row sp"><h1 style="font-size:20px">Central de notificações</h1><button class="chip" data-go="prefs">Preferências</button></div><div class="row"><button class="chip${S.nf==='todas'?' on':''}" data-chip="nf" data-v="todas">Todas</button><button class="chip${S.nf==='nao'?' on':''}" data-chip="nf" data-v="nao">Não lidas (${u})</button></div>${n.map(x=>`<button class="nt${x.read?' rd':''}" data-nt="${x.id}"><u style="background:var(--${x.risk?RC[x.risk]:'brand'})"></u><div class="f"><div class="row sp"><b style="font-weight:${x.read?500:600}">${x.title}</b><small>${ago(x.at)}</small></div><span class="m">${x.text}</span></div></button>`).join('')||'<div class="m">Nenhuma notificação não lida.</div>'}`},
prefs(){const p=S.prefs;return`${back('avisos','Central de notificações')}<div><h1>Preferências de notificação</h1><div class="sub">Escolha o que você quer receber</div></div><h2>Nível mínimo de risco</h2><div class="row">${['Médio','Alto','Crítico'].map(x=>`<button class="chip f${x===p.min?' on':''}" data-chip="min" data-v="${x}">${x}</button>`).join('')}</div><h2>Canais</h2><div class="card" style="padding:6px 14px">${tg('push',p.push,'Notificação push')}${tg('mail',p.mail,'E-mail')}${tg('sms',p.sms,'SMS')}</div><h2>Tipos de risco</h2><div class="card" style="padding:6px 14px">${tg('t.alagamento',p.t.alagamento,'Alagamentos')}${tg('t.calor',p.t.calor,'Ilhas de calor')}${tg('t.servicos',p.t.servicos,'Energia e água')}${tg('t.transporte',p.t.transporte,'Transporte')}</div><button class="btn p" data-go="avisos">Salvar preferências</button>`},
registrar(){const f=S.form,T=[['alagamento','Alagamento'],['calor','Calor extremo'],['transporte','Transporte'],['energia','Falta de energia'],['agua','Falta de água']];return`<div><h1>Registrar ocorrência</h1><div class="sub">Seu relato ajuda a validar riscos na sua região</div></div><h2>Tipo de ocorrência</h2><div class="row g">${T.map(([k,l])=>`<button class="chip${k===f.type?' on':''}" data-chip="ftype" data-v="${k}">${l}</button>`).join('')}</div><label><span class="mt">Local</span><input id="fl" value="${f.local||(S.cons.loc?'Zona Sul (localização aproximada)':'')}" placeholder="Bairro ou zona"></label><label><span class="mt">Descrição</span><textarea id="fd" rows="3" placeholder="Descreva o que está acontecendo">${f.desc}</textarea></label><button class="btn s" data-tog="form.photo" style="text-align:center;color:var(--brand)">${f.photo?'Foto anexada (toque para remover)':'+ Adicionar foto (opcional)'}</button><div class="card" style="padding:6px 14px">${tg('form.anon',f.anon,'Anonimizar meu registro')}<span class="m" style="font-size:12px;margin-top:-6px;padding-bottom:6px">Seu nome não será exibido (LGPD)</span></div><div id="err" class="m" style="color:var(--crit)"></div><button class="btn p" data-act="enviar">Enviar registro</button>`},
privacidade(){const c=S.cons;return`<div><h1>Privacidade e consentimento</h1><div class="sub">Seus dados são tratados conforme a LGPD (Lei nº 13.709/2018)</div></div><div class="card" style="flex-direction:row;align-items:center;gap:12px"><div style="width:48px;height:48px;border-radius:50%;background:var(--brandT);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:18px">${S.user.perfil[0]}</div><div><b>Perfil: ${S.user.perfil}</b><div class="sub">${S.user.email}</div></div></div><h2>Consentimentos</h2><div class="card" style="padding:6px 14px">${tg('c.loc',c.loc,'Localização aproximada')}${tg('c.share',c.share,'Compartilhar registros com a Defesa Civil')}${tg('c.pers',c.pers,'Notificações personalizadas')}</div><button class="btn" data-act="dados">Baixar meus dados</button>${S.pan?`<div class="card"><pre>${S.pan}</pre></div>`:''}<button class="btn" data-act="excluir" style="color:var(--crit)">${S.del?'Toque de novo para confirmar a exclusão':'Solicitar exclusão dos meus dados'}</button>`}};
function render(){let p=page();if(!S.user&&p!=='login')p='login';if(S.user&&p==='login')p='painel';if(!V[p])p='painel';const tab=['detalhe','origem'].includes(p)?'alertas':p==='prefs'?'avisos':p;$('#app').innerHTML=V[p]()+(S.user?`<nav aria-label="Navegação principal">${NAV.map(([k,l])=>`<button data-go="${k}" class="${k===tab?'on':''}" aria-label="${l}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('')}</nav>`:'')}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)};
document.addEventListener('input',e=>{if(e.target.id==='fl')S.form.local=e.target.value;if(e.target.id==='fd')S.form.desc=e.target.value});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-go],[data-ev],[data-act],[data-chip],[data-tog],[data-nt]');if(!t)return;const d=t.dataset;
if(d.go){S.pan=null;S.del=false;go(d.go)}
else if(d.ev){S.sel=+d.ev;go('detalhe')}
else if(d.nt){const n=S.nt.find(x=>x.id==d.nt);n.read=true;if(n.ev){S.sel=n.ev;go('detalhe')}else render()}
else if(d.chip){const k=d.chip,v=d.v;if(k==='perfil')S.perfil=v;if(k==='pf')S.pf=v==='Todos'?'todos':v;if(k==='lf')S.lf=v;if(k==='nf')S.nf=v;if(k==='min'){S.prefs.min=v;save()}if(k==='ftype')S.form.type=v;render()}
else if(d.tog){const a=d.tog.split('.');const o=a[0]==='form'?S.form:a[0]==='c'?S.cons:a[0]==='t'?S.prefs.t:S.prefs,k=a[a.length-1];o[k]=!o[k];save();render()}
else if(d.act){const a=d.act;
if(a==='login'){const em=$('#em').value.trim(),pw=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(em)||pw.length<4){$('#err').textContent='Informe um e-mail válido e uma senha com 4 ou mais caracteres.';return}S.user={email:em,perfil:S.perfil};save();go('painel');render()}
else if(a==='enviar'){const m=register(S.form);if(m.startsWith('Descreva')||m.startsWith('Informe')){$('#err').textContent=m;return}S.form={type:'alagamento',local:'',desc:'',anon:true,photo:false};toast(m);go('painel');render()}
else if(a==='dados'){S.pan=JSON.stringify({perfil:S.user,consentimentos:S.cons,preferencias:S.prefs,registros:S.reg,acoes:S.audit.filter(x=>x.u===S.user.perfil)},null,1);render()}
else if(a==='excluir'){if(!S.del){S.del=true;render();return}try{localStorage.removeItem('urip')}catch(e){}S.user=null;S.reg=[];S.audit=[];S.prefs=JSON.parse(JSON.stringify(DEF));S.cons={loc:true,share:true,pers:true};S.del=false;S.pan=null;go('login');render();toast('Dados pessoais excluídos.')}
else{const e=S.ev.find(x=>x.id===S.sel),u=S.user.perfil;if(a==='Confirmar')confirmEv(e,u);if(a==='Monitorar')setSt(e,'Em monitoramento',u);if(a==='Descartar')setSt(e,'Descartado',u);if(a==='Encerrar')setSt(e,'Encerrado',u);if(a==='Confirmar'||a==='Monitorar')S.last=now();render()}}});
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
setInterval(tick,1e4);setInterval(()=>{const u=$('#upd');if(u)u.textContent=ago(S.last)},1e3);
render();
</script>
</body>
</html>
